name: Publish ClawHub skill

on:
  push:
    branches: [main]
    paths:
      - "skills/mosqlimate/**"
      - ".github/workflows/clawhub-publish.yml"
  pull_request:
    paths:
      - "skills/mosqlimate/**"
      - ".github/workflows/clawhub-publish.yml"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Validate only; do not publish"
        type: boolean
        default: true

concurrency:
  group: clawhub-publish
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
      id-token: write
    uses: openclaw/clawhub/.github/workflows/skill-publish.yml@main
    with:
      skill_path: skills/mosqlimate
      # Push to main only publishes when CLAWHUB_PUBLISH is set to "true".
      dry_run: ${{ github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.dry_run) || (github.event_name == 'push' && vars.CLAWHUB_PUBLISH != 'true') }}
      owner: mosqlimate-project
      categories: integrations,research
      topics: epidemiology,forecasting,dengue,brazil
    secrets:
      clawhub_token: ${{ secrets.CLAWHUB_TOKEN }}
